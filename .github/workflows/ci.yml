name: CI

# Проверки на каждый push/PR: сборка хоста + тесты, синтаксис shell-скриптов,
# shellcheck (серьёзные ошибки). Релизный workflow — отдельно, по тегу.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка инструментов
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make gcc file shellcheck

      - name: Сборка (host) без предупреждений
        run: |
          make clean || true
          make CC=gcc CFLAGS="-O2 -std=c11 -Wall -Wextra -Wpedantic -Werror"

      - name: Host-тесты
        run: make test

      - name: Проверка shell-синтаксиса
        run: |
          set -e
          fail=0
          for f in install.sh bootstrap.sh tools/*.sh init/entware/* \
                   opkg/prerm opkg/postrm tests/*.sh; do
            [ -f "$f" ] || continue
            if ! sh -n "$f"; then echo "SYNTAX FAIL: $f"; fail=1; fi
          done
          exit "$fail"

      - name: shellcheck (только ошибки; предупреждения — информативно)
        run: |
          set +e
          shellcheck -S error install.sh bootstrap.sh tools/*.sh \
                     opkg/prerm opkg/postrm || exit 1

      - name: Проверка сборки .ipk (linux x86_64)
        run: |
          set -e
          sh tools/make-ipk.sh --one x86_64 susanin-agent --out dist-ci --version ci
          ls -l dist-ci
          # .ipk = gzip(tar) с ./debian-binary и ./data.tar.gz (формат фида Entware)
          tar -tzf dist-ci/*.ipk | grep -q './debian-binary'
          tar -tzf dist-ci/*.ipk | grep -q './data.tar.gz'

      - name: Единый список поставки (.ipk / манифест)
        run: |
          set -e
          sh tools/check-shipping.sh
          sh tools/check-shipping.sh --ipk "$(ls dist-ci/*.ipk | head -1)"

      - name: Пробная сборка tar-архива (CI-раскладка из манифеста)
        run: |
          set -e
          sh tools/stage-release.sh --out /tmp/stage --bin susanin-agent
          test -f /tmp/stage/susanin-agent
          test -f /tmp/stage/docs/README.md
          test -f /tmp/stage/S94susanin
          test -f /tmp/stage/www/index.html
